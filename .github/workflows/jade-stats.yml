name: Jade stats

on:
  schedule:
    - cron: "23 7 * * *"   # once a day
  workflow_dispatch:        # "Run workflow" button
  push:
    paths:
      - "scripts/jade_stats.py"
      - ".github/workflows/jade-stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the Jade & Chrome stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}   # optional, adds private contributions
          LOGIN: ${{ github.repository_owner }}
        run: python scripts/jade_stats.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats
          git diff --cached --quiet || (git commit -m "Update stats" && git push)
